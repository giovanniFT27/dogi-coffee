backend:
  name: github
  repo: giovanniFT27/dogi-coffee
  branch: main
  base_url: https://dogi-coffee-oauth.giovanni-fabian.workers.dev
  auth_endpoint: auth

media_folder: "assets/images"
public_folder: "/dogi-coffee/assets/images"

collections:
  - name: "productos"
    label: "Productos"
    folder: "content/productos"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Nombre del Producto", name: "title", widget: "string" }
      - { label: "Categoría", name: "category", widget: "select", options: ["Cafés Calientes", "Bebidas Frías", "Especialidades", "Snacks"] }
      - { label: "¿Este producto tiene tamaños?", name: "hasSizes", widget: "boolean", default: false, required: false }
      - { label: "Precio único ($ MXN)", name: "price", widget: "number", value_type: "int", required: false, condition: { field: "hasSizes", value: false } }
      - { label: "Precio tamaño chico ($ MXN)", name: "smallPrice", widget: "number", value_type: "int", required: false, condition: { field: "hasSizes", value: true } }
      - { label: "Precio tamaño grande ($ MXN)", name: "largePrice", widget: "number", value_type: "int", required: false, condition: { field: "hasSizes", value: true } }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Foto principal del Producto", name: "image", widget: "image" }
      - label: "Galería de imágenes adicionales"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Imagen", name: "image", widget: "image" }

  - name: "informacion-local"
    label: "Información del local"
    files:
      - name: "horario-ubicacion"
        label: "Horario y ubicación"
        file: "content/configuracion.json"
        fields:
          - { label: "CONFIGURA LOS DÍAS Y HORAS DE APERTURA", name: "ayudaHorario", widget: "hidden", default: "" }
          - { label: "Lunes — ¿Abre este día?", name: "lunes_abierto", widget: "boolean", default: false }
          - { label: "Lunes — Hora de apertura (24 h)", name: "lunes_apertura", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 08:30"] }
          - { label: "Lunes — Hora de cierre (24 h)", name: "lunes_cierre", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 18:00"] }
          - { label: "Martes — ¿Abre este día?", name: "martes_abierto", widget: "boolean", default: false }
          - { label: "Martes — Hora de apertura (24 h)", name: "martes_apertura", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 08:30"] }
          - { label: "Martes — Hora de cierre (24 h)", name: "martes_cierre", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 18:00"] }
          - { label: "Miércoles — ¿Abre este día?", name: "miercoles_abierto", widget: "boolean", default: false }
          - { label: "Miércoles — Hora de apertura (24 h)", name: "miercoles_apertura", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 08:30"] }
          - { label: "Miércoles — Hora de cierre (24 h)", name: "miercoles_cierre", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 18:00"] }
          - { label: "Jueves — ¿Abre este día?", name: "jueves_abierto", widget: "boolean", default: false }
          - { label: "Jueves — Hora de apertura (24 h)", name: "jueves_apertura", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 08:30"] }
          - { label: "Jueves — Hora de cierre (24 h)", name: "jueves_cierre", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 18:00"] }
          - { label: "Viernes — ¿Abre este día?", name: "viernes_abierto", widget: "boolean", default: false }
          - { label: "Viernes — Hora de apertura (24 h)", name: "viernes_apertura", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 08:30"] }
          - { label: "Viernes — Hora de cierre (24 h)", name: "viernes_cierre", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 18:00"] }
          - { label: "Sábado — ¿Abre este día?", name: "sabado_abierto", widget: "boolean", default: false }
          - { label: "Sábado — Hora de apertura (24 h)", name: "sabado_apertura", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 08:30"] }
          - { label: "Sábado — Hora de cierre (24 h)", name: "sabado_cierre", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 18:00"] }
          - { label: "Domingo — ¿Abre este día?", name: "domingo_abierto", widget: "boolean", default: false }
          - { label: "Domingo — Hora de apertura (24 h)", name: "domingo_apertura", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 08:30"] }
          - { label: "Domingo — Hora de cierre (24 h)", name: "domingo_cierre", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Usa formato HH:MM, por ejemplo 18:00"] }
          - { label: "Enlace de Google Maps", name: "mapsUrl", widget: "string", required: false, hint: "Pega el enlace para compartir de Google Maps del local." }
